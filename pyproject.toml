[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "funding-autopilot-skill"
version = "0.1.0"
description = "CV-gated research funding discovery and evidence-backed proposal skill"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Funding Autopilot contributors"}]

[project.optional-dependencies]
documents = ["pypdf>=4", "python-docx>=1"]

[tool.setuptools]
py-modules = []
