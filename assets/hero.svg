<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="hero-title hero-desc">
<title id="hero-title">Funding Autopilot — an editorial poster for year-round research funding readiness</title>
<desc id="hero-desc">An original, restrained Swiss editorial composition with warm paper, black typography, botanical green and brick red graphic art. No AI chat bubbles, robots, gradients, or artificial dashboard screenshots.</desc>
<rect width="1600" height="720" fill="#F5F2EA"/>
<rect x="26" y="26" width="1548" height="668" fill="none" stroke="#B5B7AD" stroke-width="1.4"/>
<path d="M26 104 H1574 M26 606 H1574" stroke="#AEB1A6" stroke-width="1.4"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#24312C" letter-spacing="3.3">
  <text x="78" y="77" font-size="21" font-weight="700">FUNDING AUTOPILOT</text>
  <text x="851" y="77" font-size="16">A FIELD GUIDE TO RESEARCH OPPORTUNITY</text>
  <text x="1526" y="77" font-size="17" text-anchor="end">VOL. 01</text>
</g>
<g>
 <rect x="77" y="148" width="10" height="62" fill="#B65B43"/>
 <text x="114" y="170" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#A4523C" letter-spacing="3">FOR RESEARCHERS, BY RESEARCHERS</text>
</g>
<g font-family="Georgia,Times New Roman,serif" fill="#1F2D28">
 <text x="78" y="301" font-size="104" letter-spacing="-5">Funding</text>
 <text x="78" y="404" font-size="104" letter-spacing="-5">Autopilot.</text>
</g>
<path d="M80 432 H670" stroke="#A1A69B" stroke-width="1.5"/>
<g font-family="Georgia,Times New Roman,serif" fill="#34413A" font-size="30">
 <text x="79" y="487">There are no researchers who cannot</text>
 <text x="79" y="525">secure funding—only those who are not</text>
 <text x="79" y="563">ready when opportunity arrives.</text>
</g>
