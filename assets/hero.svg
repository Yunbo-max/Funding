 <circle cx="21" cy="20.5" r="5.5" fill="#82E5D5"/><text x="34" y="27" fill="#E7F0FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">CV-grounded</text>
 <rect x="169" width="177" height="41" rx="20" fill="#19375F" stroke="#4166A5"/>
 <circle cx="190" cy="20.5" r="5.5" fill="#A4B8FF"/><text x="203" y="27" fill="#E7F0FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">Source-verified</text>
 <rect x="359" width="177" height="41" rx="20" fill="#19375F" stroke="#4166A5"/>
 <circle cx="380" cy="20.5" r="5.5" fill="#FFC992"/><text x="393" y="27" fill="#E7F0FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">Human-controlled</text>
</g>
