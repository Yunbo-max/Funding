</g>
<text x="99" y="276" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="66" font-weight="750" letter-spacing="-2">Research funding,</text>
<text x="99" y="357" fill="url(#blue)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="70" font-weight="750" letter-spacing="-2.7">from idea to application.</text>
<text x="101" y="412" fill="#C2D2F1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">Discover opportunities. Verify eligibility.</text>
<text x="101" y="448" fill="#C2D2F1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">Prepare rigorously. Write with evidence.</text>
<g transform="translate(100 508)">
