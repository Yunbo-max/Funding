<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
<title id="title">Funding Autopilot — Research funding, from discovery to application</title>
<desc id="desc">A dark academic AI infrastructure cover with a CV-grounded research funding pipeline and four evidence-based stages.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#091326"/><stop offset="58%" stop-color="#111F3B"/><stop offset="100%" stop-color="#0B1730"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#A9BDFF"/><stop offset="100%" stop-color="#73E3C8"/></linearGradient>
 <linearGradient id="blueBar" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#527CFB"/><stop offset="100%" stop-color="#70D7DC"/></linearGradient>
 <radialGradient id="ambient"><stop offset="0%" stop-color="#436FE1" stop-opacity=".39"/><stop offset="100%" stop-color="#436FE1" stop-opacity="0"/></radialGradient>
 <radialGradient id="ambient2"><stop offset="0%" stop-color="#50B6A8" stop-opacity=".29"/><stop offset="100%" stop-color="#50B6A8" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse"><path d="M 52 0 L 0 0 0 52" fill="none" stroke="#A5C0FF" stroke-width=".7" opacity=".075"/></pattern>
 <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="0" dy="15" stdDeviation="24" flood-color="#000719" flood-opacity=".5"/></filter>
</defs>
