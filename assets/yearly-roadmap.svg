<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="830" viewBox="0 0 1600 830" role="img" aria-labelledby="annualTitle annualDesc">
<title id="annualTitle">A year, not a deadline — funding readiness timeline</title>
<desc id="annualDesc">A typographic publication-style twelve-month grid showing evidence, discovery, host relations, grant preparation, proposal writing and learning from real outcomes. The months are illustrative, not funder deadlines.</desc>
<rect width="1600" height="830" fill="#F5F2EA"/>
<line x1="55" y1="47" x2="1542" y2="47" stroke="#293D33" stroke-width="2"/>
<text x="62" y="83" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2.6" fill="#A45440">RESEARCH READINESS  /  AN ANNUAL PRACTICE</text>
<text x="62" y="148" font-family="Georgia,serif" font-size="60" fill="#21362D">A year, not a deadline.</text>
<text x="1536" y="118" text-anchor="end" font-family="Arial,sans-serif" font-size="16" fill="#5F6B60">M01—M12  /  RELATIVE MONTHS</text>
