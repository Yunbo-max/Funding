<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="annualtitle annualdesc">
<title id="annualtitle">A year of funding readiness — a rolling twelve-month preparation roadmap</title>
<desc id="annualdesc">Illustrative overlapping activities throughout twelve months: profile evidence, global opportunity discovery, finding PI and host institutions, research preparation, proposal writing, and learning from outcomes. Actual deadlines vary by funder.</desc>
