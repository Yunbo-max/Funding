<line x1="56" y1="638" x2="1537" y2="638" stroke="#B5B6A9" stroke-width="1.2"/>
<text x="58" y="669" font-family="Georgia,serif" font-size="18" fill="#505E51">Start with the published criteria. Write only claims the researcher can support.</text>
