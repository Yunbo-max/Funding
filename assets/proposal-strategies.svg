  <text x="18" y="132" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2.2" fill="#70796D">THE QUESTION</text>
  <line x1="17" y1="146" x2="266" y2="146" stroke="#B5B6A9" stroke-width="1.2"/>
  <text x="17" y="184" font-family="Georgia,serif" font-size="27" fill="#26372F">Project Grant</text>
  <text x="17" y="224" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.8" fill="#B65B43">REVIEWER'S QUESTION</text>
  <text x="17" y="254" font-family="Georgia,serif" font-size="19" fill="#394C3F">What new knowledge</text>
  <text x="17" y="280" font-family="Georgia,serif" font-size="19" fill="#394C3F">will this create?</text>
  <line x1="17" y1="294" x2="266" y2="294" stroke="#D1CEC2" stroke-width="1"/>
  <text x="17" y="320" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#B65B43">NARRATIVE</text>
  <text x="17" y="345" font-family="Arial,sans-serif" font-size="16" fill="#3C493E">Hypothesis, method,</text>
  <text x="17" y="369" font-family="Arial,sans-serif" font-size="16" fill="#3C493E">strong comparisons.</text>
  <text x="17" y="397" font-family="Arial,sans-serif" font-size="13" fill="#657063">Methods · costs · feasibility</text>
</g><g transform="translate(652 199)">
  <rect width="283" height="412" fill="#EFEBE0"/>
