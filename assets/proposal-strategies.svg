  <text x="18" y="132" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2.2" fill="#70796D">THE OUTCOME</text>
  <line x1="17" y1="146" x2="266" y2="146" stroke="#B5B6A9" stroke-width="1.2"/>
  <text x="17" y="184" font-family="Georgia,serif" font-size="27" fill="#26372F">Impact Award</text>
  <text x="17" y="224" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.8" fill="#A96A4E">REVIEWER'S QUESTION</text>
  <text x="17" y="254" font-family="Georgia,serif" font-size="19" fill="#394C3F">What changed</text>
