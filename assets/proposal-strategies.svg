<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="690" viewBox="0 0 1600 690" role="img" aria-labelledby="strategiesTitle strategiesDesc">
<title id="strategiesTitle">Five distinct research funding application arguments</title>
<desc id="strategiesDesc">A refined editorial information plate with five typographic columns illustrating fellowship, project grant, consortium, innovation and impact-award reviewer questions and narrative evidence. These are not official application templates.</desc>
<rect width="1600" height="690" fill="#F5F2EA"/>
<line x1="52" y1="46" x2="1537" y2="46" stroke="#2B3F35" stroke-width="2"/>
<text x="57" y="80" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2.6" fill="#A5533E">WRITING FOR THE FUNDER  /  NOT A GENERIC TEMPLATE</text>
<text x="54" y="148" font-family="Georgia,serif" font-size="55" fill="#23362D">One researcher. Five arguments.</text>
<text x="1536" y="145" text-anchor="end" font-family="Arial,sans-serif" font-size="15" fill="#5F6B60">EACH SCHEME REWARDS DIFFERENT EVIDENCE</text>
<g transform="translate(52 199)">
  <rect width="283" height="412" fill="#EFEBE0"/>
  <rect x="0" y="0" width="283" height="7" fill="#385D50"/>
  <text x="18" y="101" font-family="Georgia,serif" font-size="95" font-style="italic" fill="#385D50">I</text>
  <text x="18" y="132" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2.2" fill="#70796D">THE RESEARCHER</text>
  <line x1="17" y1="146" x2="266" y2="146" stroke="#B5B6A9" stroke-width="1.2"/>
  <text x="17" y="184" font-family="Georgia,serif" font-size="27" fill="#26372F">Fellowship</text>
  <text x="17" y="224" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.8" fill="#385D50">REVIEWER'S QUESTION</text>
  <text x="17" y="254" font-family="Georgia,serif" font-size="19" fill="#394C3F">Why you?</text>
  <text x="17" y="280" font-family="Georgia,serif" font-size="19" fill="#394C3F">Why at this stage?</text>
  <line x1="17" y1="294" x2="266" y2="294" stroke="#D1CEC2" stroke-width="1"/>
  <text x="17" y="320" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#385D50">NARRATIVE</text>
  <text x="17" y="345" font-family="Arial,sans-serif" font-size="16" fill="#3C493E">An independent vision</text>
  <text x="17" y="369" font-family="Arial,sans-serif" font-size="16" fill="#3C493E">and development plan.</text>
  <text x="17" y="397" font-family="Arial,sans-serif" font-size="13" fill="#657063">CV record · mentor · host</text>
</g><g transform="translate(352 199)">
  <rect width="283" height="412" fill="#ECE9DE"/>
  <rect x="0" y="0" width="283" height="7" fill="#B65B43"/>
