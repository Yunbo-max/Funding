<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="typesTitle typesDesc">
<title id="typesTitle">Different funding schemes need different application arguments</title>
<desc id="typesDesc">Five scheme-specific writing patterns for fellowships, research project grants, collaborative consortia, innovation grants, and research impact awards. Each emphasizes a different reviewer question and evidence set. Exact funder rules always govern.</desc>
<defs><linearGradient id="typesBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0B1830"/><stop offset="100%" stop-color="#172C46"/></linearGradient></defs>
<rect width="1600" height="700" rx="22" fill="url(#typesBg)"/>
<text x="47" y="73" fill="#F1F6FD" font-family="Inter,Arial,sans-serif" font-size="39" font-weight="780">ONE RESEARCHER. FIVE PROPOSAL STRATEGIES.</text>
<text x="49" y="114" fill="#BACDE6" font-family="Inter,Arial,sans-serif" font-size="21">The same CV must tell a different, evidence-backed story for each funding scheme.</text>
<g transform="translate(45 169)"><rect width="287" height="418" rx="19" fill="#152845" stroke="#8AAAF9" stroke-opacity=".62" stroke-width="1.6"/><rect x="17" y="18" width="253" height="7" rx="3" fill="#8AAAF9"/>
