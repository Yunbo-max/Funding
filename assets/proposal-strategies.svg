  <text x="17" y="345" font-family="Arial,sans-serif" font-size="16" fill="#3C493E">Observed external change,</text>
  <text x="17" y="369" font-family="Arial,sans-serif" font-size="16" fill="#3C493E">beneficiaries, attribution.</text>
  <text x="17" y="397" font-family="Arial,sans-serif" font-size="13" fill="#657063">External evidence · attribution</text>
