  <line x1="17" y1="146" x2="266" y2="146" stroke="#B5B6A9" stroke-width="1.2"/>
  <text x="17" y="184" font-family="Georgia,serif" font-size="27" fill="#26372F">Consortium</text>
  <text x="17" y="224" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.8" fill="#9B8056">REVIEWER'S QUESTION</text>
  <text x="17" y="254" font-family="Georgia,serif" font-size="19" fill="#394C3F">Why must these</text>
  <text x="17" y="280" font-family="Georgia,serif" font-size="19" fill="#394C3F">groups collaborate?</text>
  <line x1="17" y1="294" x2="266" y2="294" stroke="#D1CEC2" stroke-width="1"/>
  <text x="17" y="320" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#9B8056">NARRATIVE</text>
  <text x="17" y="345" font-family="Arial,sans-serif" font-size="16" fill="#3C493E">Shared aims, partner roles,</text>
  <text x="17" y="369" font-family="Arial,sans-serif" font-size="16" fill="#3C493E">governance and outputs.</text>
  <text x="17" y="397" font-family="Arial,sans-serif" font-size="13" fill="#657063">Partner roles · support letters</text>
</g><g transform="translate(952 199)">
  <rect width="283" height="412" fill="#ECE9DE"/>
  <rect x="0" y="0" width="283" height="7" fill="#537E70"/>
  <text x="18" y="101" font-family="Georgia,serif" font-size="95" font-style="italic" fill="#537E70">IV</text>
  <text x="18" y="132" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2.2" fill="#70796D">THE USER</text>
  <line x1="17" y1="146" x2="266" y2="146" stroke="#B5B6A9" stroke-width="1.2"/>
  <text x="17" y="184" font-family="Georgia,serif" font-size="27" fill="#26372F">Innovation</text>
  <text x="17" y="224" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.8" fill="#537E70">REVIEWER'S QUESTION</text>
  <text x="17" y="254" font-family="Georgia,serif" font-size="19" fill="#394C3F">Who needs it?</text>
  <text x="17" y="280" font-family="Georgia,serif" font-size="19" fill="#394C3F">Who will adopt it?</text>
  <line x1="17" y1="294" x2="266" y2="294" stroke="#D1CEC2" stroke-width="1"/>
  <text x="17" y="320" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#537E70">NARRATIVE</text>
  <text x="17" y="345" font-family="Arial,sans-serif" font-size="16" fill="#3C493E">Delivery, validation,</text>
  <text x="17" y="369" font-family="Arial,sans-serif" font-size="16" fill="#3C493E">milestones and IP.</text>
  <text x="17" y="397" font-family="Arial,sans-serif" font-size="13" fill="#657063">User need · pilots · IP</text>
</g><g transform="translate(1252 199)">
  <rect width="283" height="412" fill="#EFEBE0"/>
  <rect x="0" y="0" width="283" height="7" fill="#A96A4E"/>
