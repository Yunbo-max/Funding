<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="475" viewBox="0 0 1600 475" role="img" aria-labelledby="workflow-title workflow-desc">
<title id="workflow-title">Funding Autopilot: Setup, Search, Match, Prepare, Apply, Track</title>
<desc id="workflow-desc">Six connected stages of the funding application workflow, highlighting preparation as a distinct, user-reviewed stage between matching and application writing.</desc>
<defs><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FCFDFF"/><stop offset="100%" stop-color="#F1F6FD"/></linearGradient></defs>
