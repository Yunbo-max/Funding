<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="470" viewBox="0 0 1600 470" role="img" aria-labelledby="flow-title flow-desc">
<title id="flow-title">The Funding Autopilot six-stage research process</title>
<desc id="flow-desc">An editorial typography diagram: Setup, Search, Match, Prepare, Apply and Track. The preparation stage is visually emphasized as a separate gate before writing.</desc>
<rect width="1600" height="470" fill="#F5F2EA"/>
<path d="M52 53 H1548 M52 417 H1548" stroke="#AEB3A5" stroke-width="1.2"/>
<text x="62" y="84" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#A4533C" font-weight="700" letter-spacing="2.7">THE METHOD    /    SIX DECISIONS</text>
<text x="61" y="151" font-family="Georgia,Times New Roman,serif" font-size="51" fill="#20312B">A process for being ready.</text>
<text x="1537" y="142" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="15" letter-spacing="1.2" fill="#596657">RESEARCH WORKFLOW  /  01—06</text>
<g transform="translate(65 191)">
 
 <text x="0" y="31" font-family="Georgia,Times New Roman,serif" font-size="62" font-style="italic" fill="#B1ADA2">01</text>
 <path d="M0 59 H204" stroke="#AAB0A3" stroke-width="1.3"/>
 <text x="0" y="101" font-family="Arial,Helvetica,sans-serif" font-weight="750" font-size="24" letter-spacing="1.5" fill="#22332C">SETUP</text>
 <text x="0" y="135" font-family="Georgia,Times New Roman,serif" font-size="19" fill="#4B574D">A verified research CV</text>
 <text x="0" y="167" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing=".5" fill="#777F70">Record what is true</text>
 <circle cx="218" cy="59" r="3.5" fill="#B55D46"/>
 </g>
<g transform="translate(311 191)">
 
 <text x="0" y="31" font-family="Georgia,Times New Roman,serif" font-size="62" font-style="italic" fill="#B1ADA2">02</text>
 <path d="M0 59 H204" stroke="#AAB0A3" stroke-width="1.3"/>
 <text x="0" y="101" font-family="Arial,Helvetica,sans-serif" font-weight="750" font-size="24" letter-spacing="1.5" fill="#22332C">SEARCH</text>
 <text x="0" y="135" font-family="Georgia,Times New Roman,serif" font-size="19" fill="#4B574D">Opportunities worldwide</text>
 <text x="0" y="167" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing=".5" fill="#777F70">Follow official calls</text>
 <circle cx="218" cy="59" r="3.5" fill="#B55D46"/>
 </g>
<g transform="translate(557 191)">
 
 <text x="0" y="31" font-family="Georgia,Times New Roman,serif" font-size="62" font-style="italic" fill="#B1ADA2">03</text>
 <path d="M0 59 H204" stroke="#AAB0A3" stroke-width="1.3"/>
 <text x="0" y="101" font-family="Arial,Helvetica,sans-serif" font-weight="750" font-size="24" letter-spacing="1.5" fill="#22332C">MATCH</text>
 <text x="0" y="135" font-family="Georgia,Times New Roman,serif" font-size="19" fill="#4B574D">Eligibility before fit</text>
 <text x="0" y="167" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing=".5" fill="#777F70">Know the constraints</text>
 <circle cx="218" cy="59" r="3.5" fill="#B55D46"/>
 </g>
<g transform="translate(803 191)">
 <rect x="-13" y="-30" width="236" height="234" fill="#E4E5D7" stroke="#A4AA91" stroke-width="1.4"/>
 <text x="0" y="31" font-family="Georgia,Times New Roman,serif" font-size="62" font-style="italic" fill="#A9533F">04</text>
 <path d="M0 59 H204" stroke="#A9533F" stroke-width="2.4"/>
 <text x="0" y="101" font-family="Arial,Helvetica,sans-serif" font-weight="750" font-size="24" letter-spacing="1.5" fill="#22332C">PREPARE</text>
 <text x="0" y="135" font-family="Georgia,Times New Roman,serif" font-size="19" fill="#4B574D">A defensible research plan</text>
 <text x="0" y="167" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing=".5" fill="#777F70">Build your case</text>
 <circle cx="218" cy="59" r="3.5" fill="#B55D46"/>
 </g>
<g transform="translate(1049 191)">
 
 <text x="0" y="31" font-family="Georgia,Times New Roman,serif" font-size="62" font-style="italic" fill="#B1ADA2">05</text>
 <path d="M0 59 H204" stroke="#AAB0A3" stroke-width="1.3"/>
 <text x="0" y="101" font-family="Arial,Helvetica,sans-serif" font-weight="750" font-size="24" letter-spacing="1.5" fill="#22332C">APPLY</text>
 <text x="0" y="135" font-family="Georgia,Times New Roman,serif" font-size="19" fill="#4B574D">Write for this funder</text>
 <text x="0" y="167" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing=".5" fill="#777F70">Critique the draft</text>
 <circle cx="218" cy="59" r="3.5" fill="#B55D46"/>
 </g>
<g transform="translate(1295 191)">
 
 <text x="0" y="31" font-family="Georgia,Times New Roman,serif" font-size="62" font-style="italic" fill="#B1ADA2">06</text>
 <path d="M0 59 H204" stroke="#AAB0A3" stroke-width="1.3"/>
 <text x="0" y="101" font-family="Arial,Helvetica,sans-serif" font-weight="750" font-size="24" letter-spacing="1.5" fill="#22332C">TRACK</text>
 <text x="0" y="135" font-family="Georgia,Times New Roman,serif" font-size="19" fill="#4B574D">Record and learn</text>
 <text x="0" y="167" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing=".5" fill="#777F70">Return better prepared</text>
 
 </g>
<g font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#46564B">
 <text x="62" y="448">SOURCE-VERIFIED  ·  APPLICANT REVIEWED</text>
 <text x="1538" y="448" text-anchor="end">PREPARE BEFORE APPLY</text>
</g>
</svg>